# Shared Claude Code pull request review for SubZeroDev repos. Not part of
# the public GitHub-ActionTemplates library.
#
# Reviews a pull request with the code-review plugin and posts the findings
# as comments. Call it from a `pull_request` workflow. `@claude` mentions are
# `claude-mention.yml`: GitHub checks every nested job's permissions against
# the caller's, skipped or not, so the two can't share a file without every
# review caller granting write access.
name: Claude review

on:
  workflow_call:
    inputs:
      prompt:
        description: "Prompt override. Defaults to the code-review plugin on the pull request."
        type: string
        default: ""
      model:
        description: "Model passed to Claude Code as `--model`. Empty uses the action's default."
        type: string
        default: ""
      skip-drafts:
        description: "Skip draft pull requests."
        type: boolean
        default: true
      skip-bots:
        description: "Skip pull requests opened by bots."
        type: boolean
        default: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

jobs:
  review:
    name: Review
    if: >-
      github.event.pull_request &&
      !(inputs.skip-drafts && github.event.pull_request.draft) &&
      !(inputs.skip-bots && github.event.pull_request.user.type == 'Bot')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: ${{ inputs.prompt || format('/code-review:code-review --comment {0}/pull/{1}', github.repository, github.event.pull_request.number) }}
          claude_args: ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
