# Static site or single-page app from the shared library: built with Node on every pull request,
# deployed to GitHub Pages from the default branch. Inputs: https://github.com/The-Running-Dev/GitHub-ActionTemplates/blob/main/docs/pages.md
name: Pages

on:
  push:
    branches: [$default-branch]
  pull_request:

permissions: {}

jobs:
  pages:
    permissions: { contents: read, pages: write, id-token: write }
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/pages.yml@v1
