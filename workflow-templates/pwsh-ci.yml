# PowerShell CI from the shared library: PSScriptAnalyzer and Pester, with test results and
# coverage. Inputs: https://github.com/The-Running-Dev/GitHub-ActionTemplates/blob/main/docs/pwsh-ci.md
name: CI

on:
  push:
    branches: [$default-branch]
  pull_request:

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/pwsh-ci.yml@v1
    with:
      os: '["ubuntu-latest", "windows-latest"]'
